spring:
  application:
    name: kidtale

  datasource:
    url: jdbc:h2:mem:kidtale
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

sweetbook:
  api:
    base-url: ${SWEETBOOK_API_BASE_URL:https://api-sandbox.sweetbook.com/v1}
    key: ${SWEETBOOK_API_KEY}

gemini:
  api:
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.0-flash}

server:
  port: 8080

logging:
  level:
    com.hyeyuns2.kidtale: DEBUG
    org.hibernate.SQL: DEBUG